<!DOCTYPE html>
<html lang="th">
<head>
    <script src="{{ url_for('static', path='/js/tailwind.js') }}"></script>
    <link href="{{ url_for('static', path='/css/all.min.css') }}" rel="stylesheet">
    <style>
        body { font-family: 'Tahoma', 'Microsoft Sans Serif', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 flex items-center justify-center h-screen font-['Inter']">
    <div class="text-center p-8 bg-white rounded-3xl shadow-xl border border-slate-100 max-w-sm w-full mx-4">
        <div class="w-20 h-20 bg-blue-50 text-blue-500 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
        </div>
        <h1 class="text-2xl font-bold text-slate-800 mb-2">ออกจากระบบสำเร็จ</h1>
        <p class="text-slate-500 mb-6">ขอบคุณที่ใช้งานระบบ HRM PRO<br>กำลังพาท่านกลับหน้าหลัก...</p>
        <div class="flex justify-center">
            <div class="w-12 h-1 bg-slate-100 rounded-full overflow-hidden">
                <div class="bg-blue-600 h-full animate-[loading_2s_ease-in-out]"></div>
            </div>
        </div>
    </div>
    <style>
        @keyframes loading {
            from { width: 0%; }
            to { width: 100%; }
        }
    </style>
</body>
</html>
