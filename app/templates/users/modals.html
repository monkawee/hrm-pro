<div id="addModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50 text-left">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm overflow-hidden">
        <div class="p-6 border-b border-gray-100 flex justify-between items-center bg-indigo-600 text-white">
            <h3 class="font-bold">สร้างบัญชีผู้ใช้งานใหม่</h3>
            <button onclick="closeAddModal()" class="text-white/80 hover:text-white"><i class="fas fa-times"></i></button>
        </div>
        <form action="/users/add" method="POST" class="p-6 space-y-4">
            <div>
                <label class="block text-sm font-semibold mb-1 text-gray-700">Username</label>
                <input type="text" name="username" required placeholder="เช่น somchai.s" 
                       class="w-full border border-gray-200 rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-indigo-500 transition">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1 text-gray-700">Password</label>
                <input type="password" name="password" required placeholder="••••••••" 
                       class="w-full border border-gray-200 rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-indigo-500 transition">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1 text-gray-700">สิทธิ์การใช้งาน (Role)</label>
                <select name="role_id" required class="w-full border border-gray-200 rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-indigo-500 transition">
                    {% for role in roles %}
                    <option value="{{ role.id }}">{{ role.display_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="pt-4 flex gap-3">
                <button type="button" onclick="closeAddModal()" class="flex-1 py-2.5 text-gray-500 font-medium text-sm hover:bg-gray-50 rounded-xl transition">ยกเลิก</button>
                <button type="submit" class="flex-1 bg-indigo-600 text-white py-2.5 rounded-xl font-bold shadow-lg shadow-indigo-100 hover:bg-indigo-700 transition">สร้าง Account</button>
            </div>
        </form>
    </div>
</div>

<div id="editModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50 text-left">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm overflow-hidden">
        <div class="p-6 border-b border-gray-100 flex justify-between items-center bg-indigo-600 text-white">
            <h3 class="font-bold text-lg">จัดการบัญชี: <span id="display_username" class="opacity-90"></span></h3>
            <button onclick="closeEditModal()" class="text-white/80 hover:text-white"><i class="fas fa-times"></i></button>
        </div>
        <div class="p-6 space-y-4">
            <input type="hidden" id="edit_user_id">
            
            <div>
                <label class="block text-sm font-semibold mb-1 text-gray-700">เปลี่ยนสิทธิ์การใช้งาน (Role)</label>
                <select id="edit_role_id" class="w-full border border-gray-200 rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-indigo-500 transition">
                    {% for role in roles %}
                    <option value="{{ role.id }}">{{ role.display_name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold mb-1 text-gray-700">เปลี่ยนรหัสผ่านใหม่</label>
                <input type="password" id="edit_password" placeholder="เว้นว่างไว้หากไม่ต้องการเปลี่ยน" 
                       class="w-full border border-gray-200 rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-indigo-500 transition">
                <p class="text-[10px] text-gray-400 mt-1">* หากต้องการเปลี่ยนรหัสผ่าน ให้ระบุรหัสใหม่ที่นี่</p>
            </div>

            <div class="pt-4 flex gap-3">
                <button type="button" onclick="closeEditModal()" class="flex-1 py-2.5 text-gray-500 font-medium text-sm hover:bg-gray-50 rounded-xl transition">ยกเลิก</button>
                <button onclick="submitUserEdit()" class="flex-1 bg-indigo-600 text-white py-2.5 rounded-xl font-bold shadow-lg shadow-indigo-100 hover:bg-indigo-700 transition">บันทึกข้อมูล</button>
            </div>
        </div>
    </div>
</div>

<script>
// --- การจัดการ Modal ---
function openAddModal() { document.getElementById('addModal').classList.remove('hidden'); }
function closeAddModal() { document.getElementById('addModal').classList.add('hidden'); }

function openEditModal(id, username, roleId) {
    document.getElementById('edit_user_id').value = id;
    document.getElementById('display_username').innerText = '@' + username;
    document.getElementById('edit_role_id').value = roleId;
    document.getElementById('edit_password').value = ''; // ล้างรหัสผ่านทุกครั้งที่เปิด
    document.getElementById('editModal').classList.remove('hidden');
}
function closeEditModal() { document.getElementById('editModal').classList.add('hidden'); }

// --- การเรียก API ---
async function submitUserEdit() {
    const id = document.getElementById('edit_user_id').value;
    const formData = new FormData();
    
    // ส่ง role_id เสมอ
    formData.append('role_id', document.getElementById('edit_role_id').value);
    
    // ส่ง password เฉพาะเมื่อมีการกรอกเท่านั้น
    const password = document.getElementById('edit_password').value;
    if (password.trim() !== "") {
        formData.append('password', password);
    }

    try {
        const response = await fetch(`/users/update/${id}`, { 
            method: 'POST', 
            body: formData 
        });

        if (response.ok) {
            window.location.reload();
        } else {
            const err = await response.json();
            alert('เกิดข้อผิดพลาด: ' + (err.detail || 'อัปเดตไม่สำเร็จ'));
        }
    } catch (e) {
        alert('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้');
    }
}

async function toggleStatus(id) {
    const response = await fetch(`/users/toggle/${id}`, { method: 'POST' });
    if (response.ok) location.reload();
}

async function deleteUser(id) {
    if (confirm('ยืนยันการลบบัญชีผู้ใช้งาน? ข้อมูลพนักงานที่ผูกไว้จะไม่ถูกลบ แต่จะเข้าสู่ระบบไม่ได้')) {
        const response = await fetch(`/users/delete/${id}`, { method: 'POST' });
        if (response.ok) location.reload();
    }
}
</script>
