<!DOCTYPE html>
<html lang="th">
<head>
    <script src="{{ url_for('static', path='/js/tailwind.js') }}"></script>
    <link href="{{ url_for('static', path='/css/all.min.css') }}" rel="stylesheet">
    <style>
        body { font-family: 'Tahoma', 'Microsoft Sans Serif', sans-serif; }
    </style>
</head>
<body class="bg-gray-50">
    <div class="max-w-6xl mx-auto p-8">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-bold text-gray-800">จัดการรายชื่อพนักงาน</h1>
            <a href="/dashboard" class="text-blue-600 hover:underline">กลับหน้า Dashboard</a>
        </div>

        <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-gray-100">
            <table class="w-full text-left">
                <thead class="bg-gray-50 border-b border-gray-100">
                    <tr>
                        <th class="p-4 font-semibold text-gray-600">ชื่อ-นามสกุล</th>
                        <th class="p-4 font-semibold text-gray-600">ตำแหน่ง (Role)</th>
                        <th class="p-4 font-semibold text-gray-600">สถานะ</th>
                        <th class="p-4 font-semibold text-gray-600 text-center">จัดการ</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-100">
                    {% for emp in employees %}
                    <tr class="hover:bg-gray-50 transition">
                        <td class="p-4 font-medium text-gray-800">{{ emp.full_name }}</td>
                        <td class="p-4"><span class="capitalize">{{ emp.role }}</span></td>
                        <td class="p-4">
                            {% if emp.is_active %}
                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">
                                <span class="w-2 h-2 mr-1.5 bg-green-500 rounded-full"></span> Active
                            </span>
                            {% else %}
                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-800">
                                <span class="w-2 h-2 mr-1.5 bg-red-500 rounded-full"></span> Disabled
                            </span>
                            {% endif %}
                        </td>
                        <td class="p-4 text-center">
                            <form action="/employees/toggle/{{ emp.id }}" method="post">
                                <button type="submit" class="text-sm font-semibold px-4 py-2 rounded-lg border shadow-sm transition
                                    {% if emp.is_active %}
                                    text-red-600 border-red-200 hover:bg-red-50
                                    {% else %}
                                    text-green-600 border-green-200 hover:bg-green-50
                                    {% endif %}">
                                    {% if emp.is_active %} ปิดกั้น {% else %} ปลดล็อก {% endif %}
                                </button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
