<!DOCTYPE html>
<html lang="th">
<head>
    <script src="{{ url_for('static', path='/js/tailwind.js') }}"></script>
    <link href="{{ url_for('static', path='/css/all.min.css') }}" rel="stylesheet">
    <style>
        body { font-family: 'Tahoma', 'Microsoft Sans Serif', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-slate-800">HRM <span class="text-blue-600">PRO</span></h1>
            <p class="text-slate-500 mt-2">กรุณาเข้าสู่ระบบเพื่อจัดการข้อมูลพนักงาน</p>
        </div>

        {% if error %}
        <div class="bg-red-50 border-l-4 border-red-500 p-4 mb-6">
            <p class="text-red-700 text-sm">{{ error }}</p>
        </div>
        {% endif %}

        <form id="loginForm" action="/login" method="post" class="space-y-6">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Username</label>
                <input type="text" id="username" name="username" required 
                    class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Password</label>
                <input type="password" id="password" name="password" required 
                    class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
            </div>
            <button type="submit" 
                class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transform transition active:scale-95 shadow-lg shadow-blue-200">
                เข้าสู่ระบบ
            </button>
        </form>
        
        {% if app_config.ENVIRONMENT != 'production' %}
        <div class="mt-6 border-t border-slate-200 pt-6">
            <p class="text-xs font-semibold text-slate-500 mb-3 text-center">Quick Login Shortcuts (Dev Only)</p>
            <div class="grid grid-cols-2 gap-3">
                <a href="/login/bypass/hr" class="flex flex-col items-center p-3 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-xl transition border border-indigo-100 group">
                    <i class="fas fa-user-tie text-lg mb-1 group-hover:scale-110 transition-transform"></i>
                    <span class="text-xs font-bold">HR Master</span>
                </a>
                <a href="/login/bypass/topmanager" class="flex flex-col items-center p-3 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 rounded-xl transition border border-emerald-100 group">
                    <i class="fas fa-crown text-lg mb-1 group-hover:scale-110 transition-transform"></i>
                    <span class="text-xs font-bold">Top Manager</span>
                </a>
                <a href="/login/bypass/manager1" class="flex flex-col items-center p-3 bg-amber-50 hover:bg-amber-100 text-amber-700 rounded-xl transition border border-amber-100 group">
                    <i class="fas fa-user-check text-lg mb-1 group-hover:scale-110 transition-transform"></i>
                    <span class="text-xs font-bold">Manager</span>
                </a>
                <a href="/login/bypass/staff1" class="flex flex-col items-center p-3 bg-sky-50 hover:bg-sky-100 text-sky-700 rounded-xl transition border border-sky-100 group">
                    <i class="fas fa-user text-lg mb-1 group-hover:scale-110 transition-transform"></i>
                    <span class="text-xs font-bold">Staff</span>
                </a>
            </div>
        </div>
        {% endif %}

        <p class="text-center text-slate-400 text-xs mt-8">© 2026 HRM PRO Solution - Senior Dev Edition</p>
    </div>
</body>
</html>
