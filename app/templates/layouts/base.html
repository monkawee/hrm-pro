<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gemini HRM{% endblock %}</title>
    <script src="{{ url_for('static', path='/js/tailwind.js') }}"></script>
    <link href="{{ url_for('static', path='/css/all.min.css') }}" rel="stylesheet">
    <style>
        body { font-family: 'Tahoma', 'Microsoft Sans Serif', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">
    <div class="flex min-h-screen">
        <aside class="w-64 bg-slate-900 text-white flex-shrink-0 hidden md:flex flex-col">
            <nav class="space-y-1">
                {% set menus = get_menus(request) %}  {% for menu in menus %}
                <a href="{{ menu.link }}" 
                class="flex items-center gap-3 px-4 py-3 rounded-xl transition 
                {% if request.url.path == menu.link %} bg-blue-600 text-white {% else %} text-slate-400 hover:bg-slate-800 {% endif %}">
                    <i class="{{ menu.icon }} w-5"></i>
                    <span>{{ menu.title }}</span>
                </a>
                {% endfor %}
            </nav>
        </aside>
        <div class="flex-1 flex flex-col">
            <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-8">
                <div class="text-sm text-gray-500">
                    หน้าปัจจุบัน: <span class="font-semibold text-gray-800">{% block page_title %}{% endblock %}</span>
                </div>
                <div class="flex items-center gap-4">
                    <span class="text-sm font-medium">{{ user.full_name if user else 'User' }}</span>
                    <div class="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold">
                        {{ user.full_name[0] if user else 'U' }}
                    </div>
                </div>
            </header>
            <main class="p-8">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
</body>
</html>
