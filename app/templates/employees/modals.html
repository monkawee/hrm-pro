<div id="addModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden">
        <div class="p-6 border-b border-gray-100 flex justify-between items-center">
            <h3 class="text-xl font-bold text-gray-800">เพิ่มพนักงานใหม่</h3>
            <button onclick="closeAddModal()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button>
        </div>
        <form action="/employees/add" method="POST" class="p-6 space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div class="col-span-2">
                    <label class="block text-sm font-semibold mb-1">ชื่อ-นามสกุล</label>
                    <input type="text" name="full_name" required class="w-full border border-gray-200 rounded-xl p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Username</label>
                    <input type="text" name="username" required class="w-full border border-gray-200 rounded-xl p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Password</label>
                    <input type="password" name="password" required class="w-full border border-gray-200 rounded-xl p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">ตำแหน่ง</label>
                    <select name="role_id" required class="w-full border border-gray-200 rounded-xl p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                        {% for role in roles %}
                        <option value="{{ role.id }}">{{ role.display_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">สายงาน (Report To)</label>
                    <select name="manager_id" class="w-full border border-gray-200 rounded-xl p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="0">ไม่มี (Direct Report)</option>
                        {% for mgr in managers %}
                        <option value="{{ mgr.id }}">{{ mgr.full_name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="flex justify-end gap-3 mt-8">
                <button type="button" onclick="closeAddModal()" class="px-5 py-2.5 text-gray-500 font-medium">ยกเลิก</button>
                <button type="submit" class="bg-blue-600 text-white px-8 py-2.5 rounded-xl font-bold shadow-lg shadow-blue-200 hover:bg-blue-700 transition">บันทึกข้อมูล</button>
            </div>
        </form>
    </div>
</div>

<div id="editModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden">
        <div class="p-6 border-b border-gray-100 flex justify-between items-center">
            <h3 class="text-xl font-bold text-gray-800">แก้ไขข้อมูลพนักงาน</h3>
            <button onclick="closeEditModal()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button>
        </div>
        <div class="p-6 space-y-4">
            <input type="hidden" id="edit_user_id">
            <div>
                <label class="block text-sm font-semibold mb-1">ชื่อ-นามสกุล</label>
                <input type="text" id="edit_full_name" class="w-full border border-gray-200 rounded-xl p-2.5 outline-none">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold mb-1">ตำแหน่ง</label>
                    <select id="edit_role_id" class="w-full border border-gray-200 rounded-xl p-2.5 outline-none">
                        {% for role in roles %}
                        <option value="{{ role.id }}">{{ role.display_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">หัวหน้างาน</label>
                    <select id="edit_manager_id" class="w-full border border-gray-200 rounded-xl p-2.5 outline-none">
                        <option value="0">ไม่มี</option>
                        {% for mgr in managers %}
                        <option value="{{ mgr.id }}">{{ mgr.full_name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="flex justify-end gap-3 mt-8">
                <button type="button" onclick="closeEditModal()" class="px-5 py-2.5 text-gray-500 font-medium">ยกเลิก</button>
                <button onclick="submitEdit()" class="bg-blue-600 text-white px-8 py-2.5 rounded-xl font-bold shadow-lg shadow-blue-200 hover:bg-blue-700 transition">อัปเดตข้อมูล</button>
            </div>
        </div>
    </div>
</div>

<script>
// Logic สำหรับเปิด-ปิด Modal และเรียก API
function openAddModal() { document.getElementById('addModal').classList.remove('hidden'); }
function closeAddModal() { document.getElementById('addModal').classList.add('hidden'); }
function openEditModal(id, name, role, manager) {
    document.getElementById('edit_user_id').value = id;
    document.getElementById('edit_full_name').value = name;
    document.getElementById('edit_role_id').value = role;
    document.getElementById('edit_manager_id').value = manager;
    document.getElementById('editModal').classList.remove('hidden');
}
function closeEditModal() { document.getElementById('editModal').classList.add('hidden'); }

async function submitEdit() {
    const id = document.getElementById('edit_user_id').value;
    const formData = new FormData();
    formData.append('full_name', document.getElementById('edit_full_name').value);
    formData.append('role_id', document.getElementById('edit_role_id').value);
    formData.append('manager_id', document.getElementById('edit_manager_id').value);

    const response = await fetch(`/employees/update/${id}`, { method: 'POST', body: formData });
    if (response.ok) location.reload(); else alert('เกิดข้อผิดพลาดในการอัปเดต');
}

async function toggleStatus(id) {
    const response = await fetch(`/employees/toggle/${id}`, { method: 'POST' });
    if (response.ok) location.reload();
}

async function deleteEmployee(id) {
    if (confirm('ยืนยันการลบพนักงาน?')) {
        const response = await fetch(`/employees/delete/${id}`, { method: 'POST' });
        if (response.ok) location.reload();
    }
}
</script>
