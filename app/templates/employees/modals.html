<div id="addModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50 text-left">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden">
        <div class="p-6 border-b border-gray-100 flex justify-between items-center bg-blue-600 text-white">
            <h3 class="text-xl font-bold">เพิ่มพนักงานใหม่</h3>
            <button onclick="closeAddModal()" class="text-white/80 hover:text-white"><i class="fas fa-times"></i></button>
        </div>
        <form action="/employees/add" method="POST" class="p-6 space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div class="col-span-2">
                    <label class="block text-sm font-semibold mb-1">รหัสพนักงาน</label>
                    <input type="text" name="employee_code" required class="w-full border border-gray-200 rounded-xl p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">ชื่อจริง</label>
                    <input type="text" name="first_name" required class="w-full border border-gray-200 rounded-xl p-2.5 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">นามสกุล</label>
                    <input type="text" name="last_name" required class="w-full border border-gray-200 rounded-xl p-2.5 outline-none">
                </div>
                <div class="col-span-2">
                    <label class="block text-sm font-semibold mb-1">บัญชีผู้ใช้งาน (ถ้ามี)</label>
                    <select name="user_id" class="w-full border border-gray-200 rounded-xl p-2.5 outline-none">
                        <option value="0">-- ยังไม่ผูกบัญชี --</option>
                        {% for u in unlinked_users %}
                        <option value="{{ u.id }}">{{ u.username }} ({{ u.full_name }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">วันที่เริ่มงาน</label>
                    <input type="date" name="join_date" required value="{{ today }}" class="w-full border border-gray-200 rounded-xl p-2.5 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">หัวหน้างาน</label>
                    <select name="manager_id" class="w-full border border-gray-200 rounded-xl p-2.5 outline-none">
                        <option value="0">ไม่มี</option>
                        {% for mgr in employees %}
                        <option value="{{ mgr.id }}">{{ mgr.first_name }} {{ mgr.last_name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="flex justify-end gap-3 mt-8">
                <button type="button" onclick="closeAddModal()" class="px-5 py-2.5 text-gray-500 font-medium">ยกเลิก</button>
                <button type="submit" class="bg-blue-600 text-white px-8 py-2.5 rounded-xl font-bold shadow-lg shadow-blue-200">บันทึก</button>
            </div>
        </form>
    </div>
</div>

<div id="editModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50 text-left">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden">
        <div class="p-6 border-b border-gray-100 flex justify-between items-center bg-blue-600 text-white">
            <h3 class="text-xl font-bold">แก้ไขข้อมูลพนักงาน</h3>
            <button onclick="closeEditModal()" class="text-white/80 hover:text-white"><i class="fas fa-times"></i></button>
        </div>
        <div class="p-6 space-y-4">
            <input type="hidden" id="edit_emp_id">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold mb-1">ชื่อจริง</label>
                    <input type="text" id="edit_first_name" class="w-full border border-gray-200 rounded-xl p-2.5 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">นามสกุล</label>
                    <input type="text" id="edit_last_name" class="w-full border border-gray-200 rounded-xl p-2.5 outline-none">
                </div>
                <div class="col-span-2">
                    <label class="block text-sm font-semibold mb-1">ผูกบัญชีผู้ใช้งาน</label>
                    <select id="edit_user_id" class="w-full border border-gray-200 rounded-xl p-2.5 outline-none">
                        <option value="0">-- ไม่ได้ผูกไว้ --</option>
                        {% for u in unlinked_users %}
                        <option value="{{ u.id }}">{{ u.username }} ({{ u.full_name }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">วันที่เริ่มงาน</label>
                    <input type="date" id="edit_join_date" class="w-full border border-gray-200 rounded-xl p-2.5 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">หัวหน้างาน</label>
                    <select id="edit_manager_id" class="w-full border border-gray-200 rounded-xl p-2.5 outline-none">
                        <option value="0">ไม่มี</option>
                        {% for mgr in employees %}
                        <option value="{{ mgr.id }}">{{ mgr.first_name }} {{ mgr.last_name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="flex justify-end gap-3 mt-8">
                <button type="button" onclick="closeEditModal()" class="px-5 py-2.5 text-gray-500 font-medium">ยกเลิก</button>
                <button onclick="submitEdit()" class="bg-blue-600 text-white px-8 py-2.5 rounded-xl font-bold shadow-lg shadow-blue-200 hover:bg-blue-700 transition">อัปเดต</button>
            </div>
        </div>
    </div>
</div>

<script>
function openAddModal() { document.getElementById('addModal').classList.remove('hidden'); }
function closeAddModal() { document.getElementById('addModal').classList.add('hidden'); }
function closeEditModal() { document.getElementById('editModal').classList.add('hidden'); }

function openEditModal(id, fname, lname, joinDate, managerId, userId) {
    document.getElementById('edit_emp_id').value = id;
    document.getElementById('edit_first_name').value = fname;
    document.getElementById('edit_last_name').value = lname;
    document.getElementById('edit_join_date').value = joinDate;
    document.getElementById('edit_manager_id').value = managerId || 0;
    
    // ตั้งค่า User ID (ถ้าคนนี้เคยผูกไว้แล้ว ID จะโผล่มาใน Dropdown เพราะเรากรองมาเผื่อใน Service)
    document.getElementById('edit_user_id').value = userId || 0;
    
    document.getElementById('editModal').classList.remove('hidden');
}

async function submitEdit() {
    const id = document.getElementById('edit_emp_id').value;
    const formData = new FormData();
    formData.append('first_name', document.getElementById('edit_first_name').value);
    formData.append('last_name', document.getElementById('edit_last_name').value);
    formData.append('join_date', document.getElementById('edit_join_date').value);
    formData.append('manager_id', document.getElementById('edit_manager_id').value);
    formData.append('user_id', document.getElementById('edit_user_id').value);

    const response = await fetch(`/employees/update/${id}`, { method: 'POST', body: formData });
    if (response.ok) location.reload(); else alert('อัปเดตไม่สำเร็จ');
}

async function deleteEmployee(id) {
    if (confirm('ลบพนักงาน?')) {
        const response = await fetch(`/employees/delete/${id}`, { method: 'POST' });
        if (response.ok) location.reload();
    }
}
</script>
