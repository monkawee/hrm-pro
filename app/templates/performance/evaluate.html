{% extends "layouts/base.html" %}

{% block title %}แบบประเมิน - HRM PRO{% endblock %}
{% block page_title %}ประเมินผลพนักงาน{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
    <h2 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-4">ฟอร์มประเมิน KPI (สำหรับหัวหน้างาน)</h2>
    
    <form action="/performance/evaluate" method="POST" class="space-y-6">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">เลือกพนักงานที่ต้องการประเมิน</label>
            <select name="employee_id" required class="w-full border-gray-300 rounded-xl focus:ring-blue-500 focus:border-blue-500 py-2 px-3 border">
                {% for emp in employees %}
                    <option value="{{ emp.id }}">{{ emp.employee_code }} - {{ emp.first_name }} {{ emp.last_name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ปี (Year)</label>
                <input type="number" name="year" value="2026" required class="w-full border-gray-300 rounded-xl py-2 px-3 border">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ไตรมาส (Quarter 1-4)</label>
                <input type="number" name="quarter" min="1" max="4" value="1" required class="w-full border-gray-300 rounded-xl py-2 px-3 border">
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">คะแนนรวม KPI (เต็ม 100)</label>
            <input type="number" step="0.1" name="kpi_score" min="0" max="100" required class="w-full border-gray-300 rounded-xl py-2 px-3 border font-bold text-blue-600 text-xl">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">ข้อเสนอแนะเพื่อการพัฒนา (Feedback)</label>
            <textarea name="feedback" rows="4" class="w-full border-gray-300 rounded-xl py-2 px-3 border"></textarea>
        </div>

        <div class="pt-4">
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-bold shadow-md">
                บันทึกการประเมิน
            </button>
        </div>
    </form>
</div>
{% endblock %}
